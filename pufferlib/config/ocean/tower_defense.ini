[base]
package = ocean
env_name = puffer_tower_defense
policy_name = TowerDefense

[vec]
num_envs = 8

[env]
num_envs = 512
num_agents = 8

[policy]
cnn_channels = 16
hidden_size = 64

[train]
total_timesteps = 50_000_000

torch_deterministic = False
; compile = True

[sweep.train.total_timesteps]
distribution = log_normal
min = 0.5e6
max = 70e6
mean = 40e6
scale = time