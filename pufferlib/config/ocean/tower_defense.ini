[base]
package = ocean
env_name = puffer_tower_defense
policy_name = TowerDefense

[vec]
num_envs = 8

[env]
num_envs = 512
num_agents = 8

[policy]
cnn_channels = 16
hidden_size = 64

[train]
total_timesteps = 10_000_000

torch_deterministic = False
; compile = True
anneal_lr = False
clip_coef = 0.6518028050874318
ent_coef = 0.0019718524279321737
gae_lambda = 0.7657633823466142
gamma = 0.9999
learning_rate = 0.029271873597683285
max_grad_norm = 0.7755337831836429
minibatch_size = 8192
prio_alpha = 0.6877932300511065
prio_beta0 = 0.7021878278350636
vf_clip_coef = 1.4894297991914356
vf_coef = 1.173580918253576
vtrace_c_clip = 0.8969768200077766
vtrace_rho_clip = 2.1427474864875102

[sweep]
metric = perf

; [sweep.train.total_timesteps]
; distribution = log_normal
; min = 0.5e6
; max = 45e6
; mean = 17e6
; scale = time

[sweep.train.learning_rate]
distribution = log_normal
min = 0.01
mean = 0.05
max = 0.2
scale = 0.5