[base]
package = ocean
env_name = puffer_tower_defense
policy_name = TowerDefense

[vec]
num_envs = 8

[env]
num_envs = 512
num_agents = 8

[policy]
cnn_channels = 16
hidden_size = 64

[train]
total_timesteps = 10_000_000

torch_deterministic = False
anneal_lr = False
; compile = True

[sweep]
metric = perf

; [sweep.train.total_timesteps]
; distribution = log_normal
; min = 0.5e6
; max = 45e6
; mean = 17e6
; scale = time

[sweep.train.learning_rate]
distribution = log_normal
min = 0.01
mean = 0.05
max = 1.0
scale = 0.5