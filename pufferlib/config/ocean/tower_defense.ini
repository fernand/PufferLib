[base]
package = ocean
env_name = puffer_tower_defense
policy_name = TowerDefense

[vec]
num_envs = 8

[env]
num_envs = 64
num_agents = 8

[policy]
cnn_channels = 16
hidden_size = 64

[train]
total_timesteps = 30_000_000

torch_deterministic = False
minibatch_size = 32768
clip_coef = 0.26853393300273765
ent_coef = 0.0030938028614931035
gae_lambda = 0.9357899787032216
gamma = 0.9932844084124706
learning_rate = 0.07582772194270473
max_grad_norm = 1.979428821509756
prio_alpha = 0.966192799091851
prio_beta0 = 0.9075751711400568
vf_clip_coef = 0.06396284314277402
vf_coef = 1.471901713886835
vtrace_c_clip = 0.5469318503098277
vtrace_rho_clip = 1.0600038370599931

[sweep]
metric = score

; [sweep.train.total_timesteps]
; distribution = log_normal
; min = 0.5e6
; max = 45e6
; mean = 17e6
; scale = time

[sweep.train.learning_rate]
distribution = log_normal
min = 0.01
mean = 0.05
max = 0.1
scale = 0.5